[project]
name = "aegis-rag"
version = "0.1.0"
description = "Security-first RAG: treats retrieved content as untrusted data, never instructions. Benchmarked on AgentDojo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core stays deliberately light so `uv sync` is fast and the security domain
# (trust lattice, capability gate) can be developed and unit-tested with zero
# heavy/ML/network dependencies. Everything else lives in an extra.
# Every name below is imported by code in this repository. That is the whole rule,
# and it is worth stating because the manifest used to declare fifteen packages
# nothing imported - sentence-transformers, torch, psycopg, pgvector, rank-bm25,
# langgraph, fastapi, uvicorn, mcp, ranx, numpy, scipy, statsmodels,
# pydantic-settings, structlog - while OMITTING two that are imported at module
# scope (openai, tenacity), which CI had to pin by hand to make the suite collect.
# A dependency list that describes an intended product rather than the code is a
# quiet way of overstating what exists.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The Gemini provider and its HTTP transport. `anthropic` is deliberately absent:
# no Anthropic provider is implemented, so declaring it would imply one.
llm = [
    "httpx>=0.27",
]
# Running the AgentDojo benchmark. The retrieval and statistics stacks need nothing
# here - both are standard library by design - so numpy, scipy, statsmodels and ranx
# are gone rather than installed and unused.
evals = [
    # External benchmark - we do not grade our own homework.
    # Verified to resolve on Python 3.13 / Windows (v0.1.35).
    "agentdojo>=0.1.35",
    # Gemini 3.x needs the AI Studio genai SDK directly (AgentDojo's GoogleLLM
    # is wrapped, not replaced, by evals/agentdojo/gemini_llm.py).
    "google-genai>=1.0",
    # Imported at module scope by evals/agentdojo/openai_llm.py and gemini_llm.py.
    # Available transitively through agentdojo, but pinned here because this code
    # imports them directly and should say so.
    "openai>=1.40",
    "tenacity>=8.2",
]
# The LangGraph adapter (src/aegis/adapters/langgraph.py). An adapter is the one
# place in this project allowed to depend on somebody else's agent framework, and
# it is an extra rather than a runtime dependency for the reason the whole
# adapters package exists: nothing in the library needs it, and making it a hard
# requirement would put a framework in the import graph of the middleware that
# deliberately imports none.
#
# Already present transitively via `evals` (agentdojo pulls langgraph in), but
# declared here because this code imports it directly and should say so.
langchain = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
]
# Measuring the token cost of spotlighting (scripts/estimate_defended_cost.py,
# scripts/compare_datamarks.py). Not needed by any test.
cost = [
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Non-Python files that are LOADED AT RUNTIME rather than merely shipped beside
# the code. `packages` already carries both, since both are tracked and unignored;
# these globs are insurance against a future ignore rule excluding them from the
# build, which is how a wheel ends up carrying a loader and not the file it loads:
#   *.yaml - the security policy. Without it an installed adopter fails closed
#            on every tool call with no policy to inspect.
#   *.html - the console page, read by aegis.console.server at request time.
#            Without it `python -m aegis.console.server` serves a 500 from a
#            clean install while every test passes from a checkout - the exact
#            shape of the three packaging defects this project already shipped
#            once and only found by installing the wheel somewhere empty.
artifacts = ["src/aegis/config/*.yaml", "src/aegis/console/*.html"]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
    "security: invariants that must hold for the threat model to be sound",
    "integration: requires postgres/docker",
    "costly: makes real paid API calls",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "."]
packages = ["aegis", "evals"]
strict = true
warn_unreachable = true

# agentdojo ships no py.typed, and the top-level google namespace package is
# only partially typed (google.genai carries py.typed and stays typed). These
# overrides silence "missing stubs" for the untyped parts so mypy stays strict
# on our own code without demanding stubs we do not own.
[[tool.mypy.overrides]]
module = ["agentdojo.*", "google.*"]
ignore_missing_imports = true
