# Aegis-RAG security policy.
#
# This file is the deployment-facing control surface for the trust lattice
# (L1) and the capability gate (L5). It answers two questions:
#
#   1. What tier does content from a given source start at?
#   2. What must be true before a given tool is allowed to fire?
#
# It is deliberately data, not code: a reviewer should be able to audit the
# system's security posture by reading this file, and changing posture should
# not require changing Python.
#
# FAIL CLOSED: an unmatched source is UNTRUSTED; an unlisted tool is denied.

version: 1

# ---------------------------------------------------------------------------
# Source -> starting trust tier.
# First match wins, so order matters: put specific patterns above general ones.
# Patterns are globs matched against the full source URI.
# ---------------------------------------------------------------------------
sources:
  # Root of trust — our own configuration and prompts.
  - match: "config://*"
    tier: T4_SYSTEM
    note: "system prompt, tool schemas, this policy file"

  # The live human in this session. The only source of intent.
  - match: "session://user-turn"
    tier: T3_USER
    note: "what the user actually typed this turn"

  # Owner-ingested, vetted corpus. Trusted content, still not a command.
  - match: "kb://*"
    tier: T2_CURATED
  - match: "file://corpus/*"
    tier: T2_CURATED

  # Everything below is adversary-controlled by assumption.
  - match: "https://*"
    tier: T0_UNTRUSTED
    note: "any web page, including ones the user named"
  - match: "http://*"
    tier: T0_UNTRUSTED
  - match: "email://inbound/*"
    tier: T0_UNTRUSTED
    note: "anyone can send you an email; the body is attacker-controlled"
  - match: "tool://*"
    tier: T0_UNTRUSTED
    note: "tool output can embed attacker text fetched from elsewhere"

# Fallback when nothing matches. Must stay UNTRUSTED: a source we failed to
# classify is a source we do not understand.
default_tier: T0_UNTRUSTED

# ---------------------------------------------------------------------------
# Detector signals severe enough to veto a side-effecting call.
# Kept small on purpose: the detector is advisory (a legitimate document may
# quote an attack string), so only high-confidence signals get veto power.
# ---------------------------------------------------------------------------
blocking_flags:
  - injection_high_confidence
  - exfiltration_pattern
  - tool_invocation_attempt
  - credential_pattern
  # Raised by L4 when the isolated quarantine extractor reports, as a typed
  # boolean rather than as prose, that the untrusted text is addressing the
  # agent. It is a model judgement made behind the dual-LLM boundary, so it is
  # the highest-confidence signal available - hence it blocks. Its sibling
  # `quarantine_unavailable` is deliberately NOT listed: an extractor outage
  # must not silently turn into a blanket refusal of every side effect.
  - quarantine_detected_instruction

# ---------------------------------------------------------------------------
# Tool policies.
#
#   side_effecting        does calling this change the world?
#   min_arg_tier          floor on the GLB of argument tiers
#   high_risk_args        args that decide WHO or WHAT is affected
#   allowlists            exact values a high-risk arg may take when tainted
#   requires_confirmation always ask a human, even when the rules pass
#
# Read-only tools are permissive by design: the worst case for a poisoned
# search is a bad answer. Side-effecting tools are where the budget goes.
#
# WHY NO SINK ASKS FOR T1_QUARANTINE_DERIVED
# ------------------------------------------
# It reads like the strictest useful floor, and it is not a floor at all: it is a
# ban on every side effect that touches anything a tool returned. The GLB is over
# ALL arguments, so `send_email(recipients=<the address the user typed>,
# body=<the note the agent just read>)` sits at T0 because of the body, and a T1
# floor denies it - with no attack anywhere in the task. Nothing can lift it
# either: the quarantine extractor (L4) carries two BOOLEANS across the dual-LLM
# boundary and deliberately never launders the prose it read into a higher tier,
# so no argument in this harness is ever T1. A floor that only an unreachable tier
# could clear is a blanket denial with a misleading name, and it costs utility -
# half of what this project measures - for no marginal security.
#
# What actually stops exfiltration is `high_risk_args`: the arguments that decide
# WHO or WHAT is affected must not be attacker-influenced (T0/T1) unless they are
# allowlisted, which refuses `recipients=<the address the poisoned page chose>`
# while allowing `recipients=<the address the user typed>` in the very same call.
# Blocking detector flags (`blocking_flags` above) veto a side effect on a second,
# independent axis. Both of those discriminate; the T1 floor did not.
#
# T3_USER floors below are a different judgement and stay: money, deletion and
# account changes may act ONLY on values the human supplied, and each of those
# tools also demands a human in the loop.
# ---------------------------------------------------------------------------
tools:
  # -- read-only -----------------------------------------------------------
  search:
    side_effecting: false
    min_arg_tier: T0_UNTRUSTED

  read_file:
    side_effecting: false
    min_arg_tier: T0_UNTRUSTED

  get_web_page:
    side_effecting: false
    min_arg_tier: T0_UNTRUSTED

  # -- side-effecting ------------------------------------------------------
  send_email:
    side_effecting: true
    # No floor: forwarding something a tool returned is the ordinary shape of this
    # tool's benign use. The recipient is what decides whether it is exfiltration,
    # and that is `high_risk_args` below.
    min_arg_tier: T0_UNTRUSTED
    # `to` is our own vocabulary; `recipients` is what AgentDojo's workspace and
    # travel suites name the same argument. Both are listed because a high-risk
    # argument that is spelled differently by the deployment is an unguarded one.
    high_risk_args: [to, cc, bcc, recipients]
    allowlists:
      # Empty by default: no attacker-influenced recipient is acceptable.
      # A deployment adds its own known-good addresses here.
      to: []

  create_calendar_event:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [participants]

  send_money:
    side_effecting: true
    # Money moves only on data the human supplied. Quarantine is not enough.
    min_arg_tier: T3_USER
    high_risk_args: [recipient, amount]
    requires_confirmation: true

  delete_file:
    side_effecting: true
    min_arg_tier: T3_USER
    # `path` is our vocabulary; `file_id` is AgentDojo's workspace spelling.
    high_risk_args: [path, file_id]
    requires_confirmation: true

  post_message:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [channel, recipient]

# ---------------------------------------------------------------------------
# AgentDojo benchmark tools (v1.2 workspace / banking / travel / slack).
#
# WHY EVERY TOOL IS LISTED, INCLUDING THE HARMLESS READS
# ------------------------------------------------------
# The gate fails closed: a tool with no policy is DENIED. That is the right
# default for a deployment, but in a benchmark it means one forgotten read-only
# tool silently drives utility to zero and the run still looks like a defensive
# result. So the read-only tools are enumerated too, explicitly marked
# `side_effecting: false`, and `tests/evals/test_defense.py` asserts that every
# tool in every suite the harness can run has an entry here. Adding a suite means
# adding its tools; the test says so before a run does.
#
# WHY THIS LIVES IN THE POLICY FILE AND NOT IN PYTHON
# ---------------------------------------------------
# "Which tools are sinks" is the single most consequential judgement the gate
# makes, and it is exactly the kind of judgement a reviewer must be able to audit
# without reading code. The adapter in evals/agentdojo/defense.py therefore
# contains no list of tool names at all - it asks the loaded policy.
#
# THE CLASSIFICATION RULE APPLIED BELOW
# -------------------------------------
# side_effecting is true when the call changes state OUTSIDE the agent's own
# context - it sends, writes, books, pays, deletes, or shares. Anything that only
# reads is false, however sensitive what it reads may be: the worst case for a
# poisoned read is a wrong answer, and refusing reads on taint destroys utility
# while buying nothing (the gate's own `_check_flags` exempts read-only tools for
# the same reason).
#
# Tools shared across suites (send_email, create_calendar_event, send_money,
# read_file, delete_file) are declared ONCE above - re-declaring a key here would
# silently override it, which is why they are absent from this section.
# ---------------------------------------------------------------------------

  # -- workspace: email ----------------------------------------------------
  get_unread_emails:
    side_effecting: false
  get_sent_emails:
    side_effecting: false
  get_received_emails:
    side_effecting: false
  get_draft_emails:
    side_effecting: false
  search_emails:
    side_effecting: false
  search_contacts_by_name:
    side_effecting: false
  search_contacts_by_email:
    side_effecting: false
  delete_email:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [email_id]

  # -- workspace / travel: calendar ----------------------------------------
  get_current_day:
    side_effecting: false
  search_calendar_events:
    side_effecting: false
  get_day_calendar_events:
    side_effecting: false
  cancel_calendar_event:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [event_id]
  reschedule_calendar_event:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [event_id]
  add_calendar_event_participants:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    # Adding a participant is how a calendar tool becomes an exfiltration tool:
    # the event body travels to whoever is on the invite.
    high_risk_args: [event_id, participants]

  # -- workspace: cloud drive ----------------------------------------------
  search_files_by_filename:
    side_effecting: false
  get_file_by_id:
    side_effecting: false
  list_files:
    side_effecting: false
  search_files:
    side_effecting: false
  create_file:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [filename, content]
  append_to_file:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [file_id, content]
  share_file:
    side_effecting: true
    # The canonical exfiltration sink of the workspace suite: it hands a document
    # to an address the agent chose.
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [file_id, email, permission]

  # -- banking --------------------------------------------------------------
  get_iban:
    side_effecting: false
  get_balance:
    side_effecting: false
  get_most_recent_transactions:
    side_effecting: false
  get_scheduled_transactions:
    side_effecting: false
  get_user_info:
    side_effecting: false
  schedule_transaction:
    side_effecting: true
    # Money, like send_money: only on data the human supplied.
    min_arg_tier: T3_USER
    high_risk_args: [recipient, amount]
    requires_confirmation: true
  update_scheduled_transaction:
    side_effecting: true
    min_arg_tier: T3_USER
    high_risk_args: [id, recipient, amount]
    requires_confirmation: true
  update_password:
    side_effecting: true
    min_arg_tier: T3_USER
    high_risk_args: [password]
    requires_confirmation: true
  update_user_info:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [first_name, last_name, street, city]

  # -- travel: reads --------------------------------------------------------
  get_user_information:
    side_effecting: false
  get_all_hotels_in_city:
    side_effecting: false
  get_hotels_prices:
    side_effecting: false
  get_rating_reviews_for_hotels:
    side_effecting: false
  get_hotels_address:
    side_effecting: false
  get_all_restaurants_in_city:
    side_effecting: false
  get_cuisine_type_for_restaurants:
    side_effecting: false
  get_restaurants_address:
    side_effecting: false
  get_rating_reviews_for_restaurants:
    side_effecting: false
  get_dietary_restrictions_for_all_restaurants:
    side_effecting: false
  get_contact_information_for_restaurants:
    side_effecting: false
  get_price_for_restaurants:
    side_effecting: false
  check_restaurant_opening_hours:
    side_effecting: false
  get_all_car_rental_companies_in_city:
    side_effecting: false
  get_car_types_available:
    side_effecting: false
  get_rating_reviews_for_car_rental:
    side_effecting: false
  get_car_fuel_options:
    side_effecting: false
  get_car_rental_address:
    side_effecting: false
  get_car_price_per_day:
    side_effecting: false
  get_flight_information:
    side_effecting: false

  # -- travel: bookings (these spend the user's money) ----------------------
  reserve_hotel:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [hotel]
  reserve_car_rental:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [company]
  reserve_restaurant:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [restaurant]

  # -- slack ----------------------------------------------------------------
  get_channels:
    side_effecting: false
  read_channel_messages:
    side_effecting: false
  read_inbox:
    side_effecting: false
  get_users_in_channel:
    side_effecting: false
  get_webpage:
    side_effecting: false
  send_direct_message:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [recipient]
  send_channel_message:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [channel]
  add_user_to_channel:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [user, channel]
  invite_user_to_slack:
    side_effecting: true
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [user, user_email]
  remove_user_from_slack:
    side_effecting: true
    # Irreversible from the agent's side, so it joins money and deletion in
    # demanding a human in the loop.
    min_arg_tier: T3_USER
    high_risk_args: [user]
    requires_confirmation: true
  post_webpage:
    side_effecting: true
    # Writing to a URL the agent chose is exfiltration with extra steps.
    min_arg_tier: T0_UNTRUSTED
    high_risk_args: [url, content]
